# Bloco a inserir em /etc/nginx/sites-available/zaz-tasklist, DENTRO do
# `server { ... }` que já existe — pode ser logo depois do `location / { }`.
#
# Por que não basta jogar os arquivos dentro do dist do Apolo:
# /home/worker/apolo/zaz-tasklist/dist é gerado pelo build do Vite e está no
# .gitignore. O próximo `atualizar_apolo.sh` recria a pasta e leva junto tudo
# que estiver lá dentro. O design system precisa de um diretório próprio.
#
# A ordem dentro do arquivo não importa: o nginx escolhe o location pelo
# prefixo mais longo que casa, não pela posição. `/design-system/` é mais
# específico que `/`, então ganha — e o try_files da SPA do Apolo não intercepta.

location /design-system/ {
    # `alias` e não `root`: com root, o nginx concatenaria e procuraria em
    # /home/worker/design-system/design-system/. A barra final nos dois lados
    # é obrigatória — sem ela o caminho sai grudado e dá 404.
    alias /home/worker/design-system/;

    index index.html;

    # =404 em vez do fallback /index.html da SPA: aqui é site estático. Se o
    # arquivo não existe, o certo é dizer que não existe, não devolver a home
    # com status 200 e deixar quem chamou achar que deu certo.
    try_files $uri $uri/ =404;

    # O CSS é consumido por páginas em outros domínios (um HTML aberto do
    # disco, um deck em outra máquina). Sem este cabeçalho o navegador busca a
    # fonte e o CSS, mas bloqueia o uso em contexto cross-origin.
    add_header Access-Control-Allow-Origin "*" always;

    # Uma hora de cache: o suficiente para a página não rebaixar a cada F5, e
    # curto o bastante para um `git pull` aparecer no mesmo expediente.
    add_header Cache-Control "public, max-age=3600" always;
}
