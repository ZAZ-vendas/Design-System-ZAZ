# Design System ZAZ — verificação automática.
#
# Este workflow NÃO publica. O site é servido pelo nginx da VM do Apolo, em
# https://apolo.zaz.vc/design-system/ — ver a seção "Publicação" do README.
#
# O GitHub Pages foi tentado e descartado: a política da organização não deixa o
# GITHUB_TOKEN criar um site do Pages ("Resource not accessible by integration"),
# e a VM já existe, já tem TLS pelo Cloudflare e já é onde o time acessa o Apolo.
# Menos uma superfície para manter.
#
# O que sobra aqui é o que realmente protege o pacote: garantir que ninguém
# mande para a main um CSS fora de sincronia com os tokens, ou uma variável que
# não existe.

name: Design System

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # tokens.css e tailwind/theme.css são GERADOS de tokens/zaz.tokens.json.
      # Se alguém editar o CSS à mão e esquecer de rodar o build, o próximo
      # `npm run build:tokens` apaga a edição sem avisar. Este passo transforma
      # esse acidente silencioso em falha de CI.
      - name: Tokens em sincronia com o CSS
        run: npm run check:tokens

      # var(--zaz-nome-errado) não dá erro no navegador: a declaração é ignorada
      # e o elemento herda o que estiver por perto. Bug invisível até alguém
      # abrir a tela. Aqui vira erro.
      - name: Nenhuma variável órfã
        run: npm run check:vars
